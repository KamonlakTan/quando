<div data-quando-block-type="style-background-colour" class="quando-block" data-quando-javascript="quando.style.colour($(inDisplay)$,'${colour}')">
    <div class="quando-left quando-style"></div>
    <div class="quando-right">
        <div class="quando-row quando-style">
            🌈 Background Colour
            <input data-quando-name="colour" type="color" value="#000000"/>
        </div>
    </div>
</div>


<div data-quando-block-type="style-text-style" class="quando-block" data-quando-javascript="quando.style.${type}($(inDisplay)$,'${style}','$(rgb$,${colour})$')">
    <div class="quando-left quando-style"></div>
    <div class="quando-right">
        <div class="quando-row quando-style">
            🌈 
            <select data-quando-name="type">
                <option value='title'>Title</option>
                <option value='text'>Text</option>
                <option value='label'>Label</option>
            </select>
            <select data-quando-name="style">
                <option value='color'>Font</option>
                <option value='background-color'>Background</option>
            </select>
            <input data-quando-name="colour" type="color" value="#ffffff"/>
        </div>
    </div>
</div>


<div data-quando-block-type="style-font-size" class="quando-block" data-quando-javascript="quando.style.font_size($(inDisplay)$,'${style}','${chars}')">

  <div class="quando-right">
    <div class="quando-row quando-style">
      <span class="iconify">🗚</span> Font Size
      <select data-quando-name="style">
        <option value='#quando_title'>Title</option>
        <option value='#quando_text'>Text</option>

      <input data-quando-name='chars' type='number' value='40' placeholder=''
        style='width: 4em' min='0' max='1000' data-quando-encode='normal'/>

</div>

<div data-quando-block-type="style-cursor-colour" class="quando-block" data-quando-javascript="quando.style.cursor_colour($(inDisplay)$,'$(rgb$,${colour})$',${opacity})">
  <div class="quando-left quando-style"></div>
  <div class="quando-right">
    <div class="quando-row quando-style" id="opacity-block">
      Cursor
      <input data-quando-name="colour" type="color" value="#ffff66" />
      <br>
      Opacity 
      <span id="opacity-value">50</span>%
      <input data-quando-name="opacity" type="range" value="50" data-quando-encode="normal" min="0" max="100" value="50"
        oninput="document.getElementById('opacity-value').innerText = this.value" id="opacity-slider" />
    </div>
  </div>
</div>


<div data-quando-block-type="style-cursor-size" class="quando-block" data-quando-javascript="quando.style.cursor_size($(inDisplay)$,${percent})">
  <div class="quando-left quando-style"></div>
  <div class="quando-right">
    <div class="quando-row quando-style">Cursor Size
      <input data-quando-name='percent' type='number' value='4.4' placeholder=''
        style='width: 4em' min='0' max='100' data-quando-encode='normal'/>%
      of screen width
    </div>
  </div>
</div>


<div data-quando-block-type="style-position" class="quando-block" data-quando-javascript="quando.style.position($(inDisplay)$,'${type}', '${direction}', ${percent})">
  <div class="quando-left quando-style"></div>
  <div class="quando-right">
    <div class="quando-row quando-style">
      <span class="iconify">⧉</span> Position
      <select data-quando-name="type">
        <option value='title'>Title</option>
        <option value='text'>Text</option>
        <option value='labels'>Labels</option>
      </select>
      <input data-quando-name='percent' type='number' value='0' placeholder=''
        style='width: 4em' min='0' max='100' data-quando-encode='normal'/>%
      &nbsp; from
      <select data-quando-name="direction">
        <option value='top'>⇧ top</option>
        <option value='bottom'>⇩ bottom</option>
        <option value='left'>⇦ left</option>
        <option value='right'>⇨ right</option>
      </select>
    </div>
  </div>
</div>


<div data-quando-block-type="style-size" class="quando-block" data-quando-javascript="quando.style.size($(inDisplay)$,'${type}', '${direction}', ${percent})">
  <div class="quando-left quando-style"></div>
  <div class="quando-right">
    <div class="quando-row quando-style">
      <span class="iconify">◱</span> Size
      <select data-quando-name="type">
        <option value='title'>Title</option>
        <option value='text'>Text</option>
        <option value='labels'>Labels</option>
      </select>
      <input data-quando-name='percent' type='number' value='50' placeholder=''
        style='width: 4em' min='0' max='100' data-quando-encode='normal'/>%
      of
      <select data-quando-name="direction">
        <option value='height'>⇕ height</option>
        <option value='width'>⇔ width</option>
      </select>
    </div>
  </div>
</div>


<div data-quando-block-type="slider-block" class="quando-block" 
    data-quando-javascript="quando.slide.update('${x}', '${y}')">
  <div class="quando-left quando-style"></div>
  <div class="quando-right">
    <div class="quando-row quando-style">
      🎚️ Slider Bar
      <br>
      (Left ↔ Right)
    </div>
    <div data-quando-drop-slot="left-right" class="quando-box"></div>
    <div class="quando-row quando-style">
      (Up ↕ Down)
    </div>
        <div data-quando-name="box-up" data-quando-drop-slot="up-down" class="quando-box"></div>
        <div class="quando-row quando-style"></div>
  </div>
</div>


<div data-quando-block-type="slide-block-left-right" class="quando-block"
    data-quando-drop-valid="slider-block"
    data-quando-drop-slot="left-right"
    data-quando-javascript="quando.slide.update('${x}', '${y}')">
  <div class="quando-left quando-style"></div>
  <div class="quando-right">
    <div class="quando-row quando-style">
      <span class='quando-info' title='Can only be dragged into Slider Bar'>⚠</span>
      <span class="iconify">↔️</span>
      Slider <label>(Left↔Right)</label>
      <select data-quando-name="extras" class="quando-toggle">
        <option value="hidden">+</option>
        <option value="show">-</option>
      </select>
      <span data-quando-toggle="extras=show">
        <br>
        <input type="range" min="-100" max="100" value="0" data-quando-name="x" data-quando-encode="normal" />
      </span>
    </div>
  </div>
</div>


<div data-quando-block-type="slide-block-up-down" class="quando-block"
    data-quando-drop-valid="slider-block"
    data-quando-drop-slot="up-down"
    data-quando-javascript="quando.slide.update('${x}', '${y}')">
  <div class="quando-left quando-style"></div>
  <div class="quando-right">
    <div class="quando-row quando-style">
      <span class='quando-info' title='Can only be dragged into For Slider'>⚠</span>
      <span class="iconify">↕️</span>
      Slider <label>(Up ↕ Down)</label>
      <select data-quando-name="extras" class="quando-toggle">
        <option value="hidden">+</option>
        <option value="show">-</option>
      </select>
      <span data-quando-toggle="extras=show">
        <br>
        <input type="range" min="-100" max="100" value="0" data-quando-name="y" data-quando-encode="normal" />
      </span>
    </div>
  </div>
</div>
